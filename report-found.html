
<!DOCTYPE html>
<html>
<head>
    <title>Report Found Item - Found It</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        h2 {
            text-align: center;
            color: #243b64;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #219150;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #243b64;
            text-decoration: none;
        }

        #preview {
            display: none;
            width: 150px;
            height: 150px;
            object-fit: cover;
            margin-top: 10px;
            border-radius: 8px;
        }

        #msg {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Report Found Item</h2>
    <p style="text-align:center;color:#666;">
        Help someone recover their lost belongings.
    </p>

    <form id="foundForm">

        <label>Item Name</label>
        <input type="text" id="title" placeholder="Enter item name" required>

        <label>Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option>Books</option>
            <option>Electronics</option>
            <option>Personal Belongings</option>
            <option>Documents</option>
            <option>Accessories</option>
            <option>Others</option>
        </select>

        <label>Description</label>
        <textarea id="description" placeholder="Describe the found item" required></textarea>

        <label>Found Location</label>
        <input type="text" id="location" placeholder="Where did you find it?" required>

        <label>Date Found</label>
        <input type="date" id="item_date" required>

        <label>Contact Email</label>
        <input type="email" id="contact_email" readonly required>

        <label>Upload Item Photo (Optional)</label>
        <input type="file" id="photo" accept="image/jpeg,image/png,image/webp">

        <img id="preview" alt="Selected item photo">

        <button type="submit">Submit Found Item</button>

    </form>

    <p id="msg"></p>

    <a href="dashboard.html" class="back">Back to Dashboard</a>

</div>


<script>

    // CHECK LOGIN

    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
        alert("Please login first!");
        window.location.href = "index.html";
    } else {
        document.getElementById("contact_email").value = user.email;
    }


    // PHOTO PREVIEW

    document.getElementById("photo").addEventListener("change", function() {

        const file = this.files[0];
        const preview = document.getElementById("preview");

        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        } else {
            preview.style.display = "none";
            preview.removeAttribute("src");
        }
    });


    // SUBMIT FOUND ITEM

    document.getElementById("foundForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const msg = document.getElementById("msg");
        const formData = new FormData();

        formData.append("title", document.getElementById("title").value);
        formData.append("category", document.getElementById("category").value);
        formData.append("description", document.getElementById("description").value);
        formData.append("location", document.getElementById("location").value);
        formData.append("item_date", document.getElementById("item_date").value);
        formData.append("contact_email", user.email);
        formData.append("user_id", user.user_id);

        const photo = document.getElementById("photo").files[0];

        if (photo) {
            formData.append("photo", photo);
        }

        try {

            const response = await fetch("http://localhost:3000/report-found", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (response.ok) {

                msg.style.color = "green";
                msg.textContent = data.message;

                document.getElementById("foundForm").reset();
                document.getElementById("contact_email").value = user.email;

                document.getElementById("preview").style.display = "none";
                document.getElementById("preview").removeAttribute("src");

            } else {

                msg.style.color = "red";
                msg.textContent = data.message;

            }

        } catch (error) {

            msg.style.color = "red";
            msg.textContent = "Cannot connect to server!";

            console.log(error);
        }

    });

</script>

</body>
</html>
