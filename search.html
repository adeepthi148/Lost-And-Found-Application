
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Items - Found It</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    margin: 0;
    padding: 20px;
}

header {
    background: #243b64;
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
}

.search-box {
    max-width: 900px;
    margin: 25px auto;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input, select {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    flex: 1;
    min-width: 180px;
}

#items {
    max-width: 1000px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 3px 10px #ddd;
}

/* Modified item image size */
.card img {
    width: 100%;
    height: 120px;
    object-fit: contain;
    background: #f1f3f7;
    border-radius: 8px;
    display: block;
    margin: 0 auto 12px;
}

.card h3 {
    color: #243b64;
}

.card p {
    overflow-wrap: anywhere;
    line-height: 1.5;
}

.status {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 15px;
    color: white;
    font-size: 13px;
}

.lost {
    background: #e74c3c;
}

.found {
    background: #27ae60;
}

#message {
    text-align: center;
    color: #555;
    grid-column: 1 / -1;
}

.back {
    display: block;
    width: fit-content;
    margin: 25px auto;
    padding: 10px 20px;
    background: #243b64;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}
</style>
</head>

<body>

<header>
    <h1>Found It</h1>
    <p>Search Lost and Found Items</p>
</header>

<div class="search-box">

    <input
        type="text"
        id="search"
        placeholder="Search by item name or location..."
        oninput="displayItems()"
    >

    <select id="status" onchange="displayItems()">
        <option value="all">All Items</option>
        <option value="lost">Lost Items</option>
        <option value="found">Found Items</option>
    </select>

    <select id="category" onchange="displayItems()">
        <option value="all">All Categories</option>
    </select>

</div>

<div id="items">
    <p id="message">Loading items...</p>
</div>

<a href="dashboard.html" class="back">Back to Dashboard</a>

<script>

let allItems = [];

// -------------------- FORMAT DATE IN IST --------------------

function formatISTDate(dateValue) {

    if (!dateValue) {
        return "Not specified";
    }

    const date = new Date(dateValue);

    if (isNaN(date.getTime())) {
        return "Not specified";
    }

    return new Intl.DateTimeFormat("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    }).format(date);
}

// -------------------- GET IMAGE URL --------------------

function getImageURL(photoPath) {

    if (!photoPath) {
        return "";
    }

    const cleanedPath = photoPath
        .replace(/\\/g, "/")
        .replace(/^\/+/, "");

    if (
        cleanedPath.startsWith("http://") ||
        cleanedPath.startsWith("https://")
    ) {
        return cleanedPath;
    }

    return "http://localhost:3000/" + cleanedPath;
}

// -------------------- LOAD ITEMS FROM DATABASE --------------------

async function loadItems() {

    try {

        const response = await fetch("http://localhost:3000/items");

        if (!response.ok) {
            throw new Error("Unable to load items");
        }

        // Display only active lost and found items.
        // Recovered items are excluded.

        const items = await response.json();

        allItems = items.filter(item =>
            item.status === "lost" || item.status === "found"
        );

        // Load available categories

        const categories = [...new Set(
            allItems.map(item => item.category).filter(Boolean)
        )];

        const categorySelect = document.getElementById("category");

        categorySelect.innerHTML =
            '<option value="all">All Categories</option>';

        categories.forEach(category => {

            const option = document.createElement("option");
            option.value = category;
            option.textContent = category;

            categorySelect.appendChild(option);
        });

        displayItems();

    } catch (error) {

        document.getElementById("items").innerHTML =
            "<p id='message'>Cannot connect to server. Please try again.</p>";

        console.log(error);
    }
}

// -------------------- DISPLAY AND FILTER ITEMS --------------------

function displayItems() {

    const search = document.getElementById("search").value.toLowerCase();
    const status = document.getElementById("status").value;
    const category = document.getElementById("category").value;

    const filtered = allItems.filter(item => {

        const text = (
            (item.title || "") + " " +
            (item.description || "") + " " +
            (item.location || "")
        ).toLowerCase();

        return text.includes(search) &&
            (status === "all" || item.status === status) &&
            (category === "all" || item.category === category);
    });

    const container = document.getElementById("items");
    container.innerHTML = "";

    if (filtered.length === 0) {

        container.innerHTML =
            "<p id='message'>No matching items found.</p>";

        return;
    }

    filtered.forEach(item => {

        const card = document.createElement("div");
        card.className = "card";

        // Item photo

        if (item.photo_path) {

            const img = document.createElement("img");

            img.src = getImageURL(item.photo_path);
            img.alt = item.title || "Item photo";

            img.onerror = function() {
                this.style.display = "none";
            };

            card.appendChild(img);
        }

        // Item title

        const title = document.createElement("h3");
        title.textContent = item.title || "Untitled item";
        card.appendChild(title);

        // Description

        const description = document.createElement("p");
        description.textContent =
            item.description || "No description";
        card.appendChild(description);

        // Location

        const location = document.createElement("p");
        location.textContent =
            "Location: " + (item.location || "Not specified");
        card.appendChild(location);

        // Category

        const categoryText = document.createElement("p");
        categoryText.textContent =
            "Category: " + (item.category || "Other");
        card.appendChild(categoryText);

        // Date and time

        const date = document.createElement("p");
        date.textContent =
            "Date: " + formatISTDate(item.item_date);
        card.appendChild(date);

        // Contact email

        const email = document.createElement("p");
        email.textContent =
            "Contact: " + (item.contact_email || "Not available");
        card.appendChild(email);

        // Reported by

        const reporter = document.createElement("p");
        reporter.textContent =
            "Reported by: " + (item.reported_by || "Not available");
        card.appendChild(reporter);

        // Status

        const badge = document.createElement("span");
        badge.className = "status " + item.status;
        badge.textContent = item.status.toUpperCase();

        card.appendChild(badge);

        container.appendChild(card);

    });
}

// -------------------- LOAD ITEMS WHEN PAGE OPENS --------------------

loadItems();

</script>

</body>
</html>
